[project]
name = "real-time-voice-translator"
version = "0.1.0"
description = "Real-time Voice Translator web app built with Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.24.0",
    "SpeechRecognition>=3.8.1",
    "deep-translator>=1.11.1",
    "gTTS>=2.3.1",
    "google-transliteration-api>=1.0.3",
    "pyaudio>=0.2.13",
    "playsound>=1.2.2"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
